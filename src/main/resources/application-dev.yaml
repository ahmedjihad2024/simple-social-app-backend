# Development profile: verbose logging, in-memory rate limiting and caches.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management:
  health:
    redis:
      enabled: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.example.socialapp: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cache: TRACE

app:
  rate-limit:
    enabled: true
    failure-strategy: FAIL_OPEN
    trusted-proxy-ips:
      - 127.0.0.1
      - "::1"
    global:
      capacity: 100
      refill-tokens: 100
      refill-duration: 1m
      key: USER
    policies:
      # Auth policies
      login:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1m
        key: IP
      register:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1h
        key: IP
      refresh:
        capacity: 20
        refill-tokens: 20
        refill-duration: 1m
        key: IP
      logout:
        capacity: 20
        refill-tokens: 20
        refill-duration: 1m
        key: IP
      verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1m
        key: IP
      resend-verification:
        capacity: 3
        refill-tokens: 3
        refill-duration: 1m
        key: IP
      password-reset-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP
      password-reset-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP
      password-reset-confirm:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP

      # Account / Profile policies
      change-identifier-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 1m
        key: IP_AND_USER
      change-identifier-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1m
        key: IP_AND_USER
      change-password:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP_AND_USER

      # Fallback aliases
      otp-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 1m
        key: IP_AND_USER
      password-reset:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP
