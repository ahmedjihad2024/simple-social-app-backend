spring:
  application:
    name: SocialApp

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?prepareThreshold=0
    username: postgres.ctxnyrzmgoxekruwikwg
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: true

server:
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET_BASE64}

springdoc:
  api-docs:
    path: /api-docs

app:
  auth:
    # Switch between email and phone sign-in: email | phone
    identifier: ${AUTH_IDENTIFIER:email}

  mail:
    backend: ${APP_MAIL_BACKEND:log}

  sms:
    backend: ${APP_SMS_BACKEND:log}

  admin:
    emails: ${ADMIN_EMAILS:}

  storage:
    backend: ${STORAGE_BACKEND:local}
    local:
      dir: ${STORAGE_DIR:uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}

  share-link:
    ios-app-ids: ${IOS_APP_IDS:}
    android-package-name: ${ANDROID_PACKAGE_NAME:}
    android-sha256-fingerprints: ${ANDROID_SHA256_FINGERPRINTS:}
    app-scheme: ${APP_SCHEME:todoappuser}
    app-store-url: ${APP_STORE_URL:}
    play-store-url: ${PLAY_STORE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    description: SocialApp API with JWT auth, i18n, and token revocation
    version: 0.0.1-SNAPSHOT
