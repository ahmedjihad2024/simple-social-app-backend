# Production profile: hardened error responses (no stacktraces or messages
# leaked to clients), response compression, quiet logging, and CORS origins
# sourced from the CORS_ALLOWED_ORIGINS environment variable.
server:
  # Port from the PORT env var (set by the platform), falling back to 8080.
  port: ${PORT:8080}
  error:
    # Never leak stack traces to clients in production.
    include-stacktrace: never
    # Hide exception messages — they can reveal internals.
    include-message: never
    # Don't expose validation binding errors verbatim.
    include-binding-errors: never
    # Don't echo the exception class name in error responses.
    include-exception: false
  compression:
    # Gzip responses to cut bandwidth.
    enabled: true
    # Only compress content types where it's actually worth it.
    mime-types: application/json,application/xml,text/html,text/plain

logging:
  level:
    # Keep prod logs quiet; only warnings/errors by default.
    root: WARN
    # App package logs at INFO so we still see business events.
    org.personal.todo: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.mongodb.driver: WARN
    org.springframework.cache: WARN

app:
  rate-limit:
    enabled: true

    failure-strategy: FAIL_OPEN

    trusted-proxy-ips:
      - 127.0.0.1
      - "::1"

    global:
      capacity: 100
      refill-tokens: 100
      refill-duration: 1m
      key: USER

    policies:

      login:
        capacity: 10
        refill-tokens: 10
        refill-duration: 1m
        key: IP

      register:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1h
        key: IP

      refresh:
        capacity: 60
        refill-tokens: 60
        refill-duration: 1m
        key: IP

      logout:
        capacity: 60
        refill-tokens: 60
        refill-duration: 1m
        key: IP

      verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP

      resend-verification:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP

      password-reset-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP

      password-reset-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 15m
        key: IP

      password-reset-confirm:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP

      change-identifier-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP_AND_USER

      change-identifier-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP_AND_USER

      change-password:
        capacity: 5
        refill-tokens: 5
        refill-duration: 15m
        key: IP_AND_USER

      otp-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP_AND_USER

      password-reset:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP

  mail:
    backend: ${APP_MAIL_BACKEND:smtp}
    code: random
  sms:
    # No log default in prod: logging OTP codes is unsafe. Implement SmsSender and set this to its name.
    backend: ${APP_SMS_BACKEND:provider}
  cors:
    # Comma-separated list of allowed origins, injected at deploy time.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    # Use S3-compatible object storage in production (Cloudflare R2 by default).
    # Local disk doesn't survive redeploys and isn't shared across instances.
    # Required env: S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY.
    backend: ${STORAGE_BACKEND:s3}


# Turn off Swagger UI and the raw OpenAPI spec in production — they expose the
# full API surface (endpoints, payload schemas, validation rules) and are meant
# for development only. Both stay enabled in the dev profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false