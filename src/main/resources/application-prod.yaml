# Production profile: response compression, quiet logging, and CORS origins
# sourced from the CORS_ALLOWED_ORIGINS environment variable.
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

logging:
  level:
    root: WARN
    com.example.socialapp: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.cache: WARN

app:
  rate-limit:
    enabled: true
    failure-strategy: FAIL_OPEN
    trusted-proxy-ips:
      - 127.0.0.1
      - "::1"
    global:
      capacity: 100
      refill-tokens: 100
      refill-duration: 1m
      key: USER
    policies:
      # Auth policies
      login:
        capacity: 10
        refill-tokens: 10
        refill-duration: 1m
        key: IP
      register:
        capacity: 5
        refill-tokens: 5
        refill-duration: 1h
        key: IP
      refresh:
        capacity: 60
        refill-tokens: 60
        refill-duration: 1m
        key: IP
      logout:
        capacity: 60
        refill-tokens: 60
        refill-duration: 1m
        key: IP
      verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP
      resend-verification:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP
      password-reset-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP
      password-reset-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 15m
        key: IP
      password-reset-confirm:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP

      # Account / Profile policies
      change-identifier-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP_AND_USER
      change-identifier-verify:
        capacity: 5
        refill-tokens: 5
        refill-duration: 5m
        key: IP_AND_USER
      change-password:
        capacity: 5
        refill-tokens: 5
        refill-duration: 15m
        key: IP_AND_USER

      # Fallback aliases
      otp-request:
        capacity: 3
        refill-tokens: 3
        refill-duration: 5m
        key: IP_AND_USER
      password-reset:
        capacity: 3
        refill-tokens: 3
        refill-duration: 15m
        key: IP

  mail:
    backend: ${APP_MAIL_BACKEND:smtp}
    code: random

  sms:
    backend: ${APP_SMS_BACKEND:provider}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  storage:
    backend: ${STORAGE_BACKEND:s3}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
